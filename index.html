<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashton's Musical Minds | Piano Lessons</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c1a4d;
            --accent: #9c7a4d;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Georgia', serif; line-height: 1.7; background: #f8f1e9; }

        header {
            background: rgba(28,20,40,0.95);
            position: fixed;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-img {
            height: 70px;
            width: auto;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.6)), #0f0a1f;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .hero h1 { font-size: 4.5rem; margin-bottom: 1rem; }
        
        .piano-keys { display: flex; justify-content: center; gap: 4px; margin: 2rem 0; height: 260px; }
        .key {
            background: white;
            border: 2px solid #111;
            border-radius: 6px 6px 0 0;
            width: 28px;
            height: 180px;
            transition: all 0.1s;
        }
        .key.black {
            background: #111;
            height: 110px;
            margin: 0 -14px;
            z-index: 2;
        }
        .key.active { background: #ffdd57; transform: scaleY(0.8); }

        .btn {
            background: var(--accent);
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <img src="Musical Minds Logo.jpeg" alt="Ashton's Musical Minds" class="logo-img">
            <div>
                <a href="#about" style="color:white; margin:0 15px;">About</a>
                <a href="#gallery" style="color:white; margin:0 15px;">Gallery</a>
                <a href="#pricing" style="color:white; margin:0 15px;">Pricing</a>
                <a href="#contact" style="color:white; margin:0 15px;">Contact</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h1>Ashton's Musical Minds</h1>
            <p style="font-size:1.6rem;">Piano Lessons • West Jordan, Utah</p>
            <div class="piano-keys" id="piano"></div>
            <a href="#contact" class="btn">Start Learning Today</a>
        </div>
    </section>

    <script>
        // Simple piano animation
        const piano = document.getElementById('piano');
        for (let i = 0; i < 8; i++) {
            const k = document.createElement('div');
            k.className = 'key';
            if ([1,3,5].includes(i)) k.classList.add('black');
            piano.appendChild(k);
        }
        let i = 0;
        setInterval(() => {
            const keys = piano.children;
            keys[i % 8].classList.add('active');
            setTimeout(() => keys[i % 8].classList.remove('active'), 200);
            i++;
        }, 180);
    </script>
</body>
</html>
